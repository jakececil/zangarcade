<!doctype html>
<html lang="en" data-clearance="closed">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151a14">
  <meta name="description" content="Play ZANG Arcade’s original game prototypes in your browser.">
  <title>ZANG Arcade</title>
  <link rel="icon" type="image/png" href="./art/brand/zang-favicon.png">
  <script>
    if (new URLSearchParams(location.search).get('from') === 'museum') document.documentElement.dataset.clearance = 'open';
    try {
      if (sessionStorage.getItem('zang-arcade-entrance-v2') === 'entered') {
        document.documentElement.dataset.clearance = 'open';
      }
    } catch {}
  </script>
  <link rel="stylesheet" href="./slot.css">
  <link rel="stylesheet" href="./cartridge.css">
  <link rel="stylesheet" href="./shelf.css?v=21065cc06ee5">
  <script src="./shelf.js?v=35310f825a1e" defer></script>
</head>
<body>
  <div class="clearance" id="clearance" role="dialog" aria-modal="true" aria-labelledby="clearance-title">
    <div class="clearance-tiles" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="clearance-panel">
      <header class="clearance-header">
        <span class="brand" data-image-fallback role="img" aria-label="ZANG Arcade">
          <span class="brand-mark" aria-hidden="true">Z</span><img src="./art/brand/zang-mark.webp" alt="" width="40" height="40">
        </span>
        <span class="terminal-status">Access pending</span>
      </header>
      <div class="clearance-body">
        <h1 id="clearance-title">Clearance<br>required.</h1>
        <button class="entrance-button" id="enter-arcade" type="button">
          Enter arcade <span aria-hidden="true">→</span>
        </button>
      </div>
      <noscript><p class="clearance-noscript">Enable JavaScript to enter the arcade and play the games.</p></noscript>
    </div>
  </div>

  <div id="arcade" inert>
    <header class="site-header wrap">
      <a class="brand" data-image-fallback href="./index.html" aria-label="ZANG Arcade home">
        <span class="brand-mark" aria-hidden="true">Z</span><img src="./art/brand/zang-mark.webp" alt="" width="40" height="40">
      </a>
      <nav class="arcade-nav" aria-label="Arcade views">
        <a class="shelf-link" href="#inventory">Game shelf <span aria-hidden="true">↓</span></a>
        <a class="museum-link" href="./arcade/">Enter 3D museum</a>
      </nav>
    </header>

    <main class="wrap">
      <section class="masthead" aria-labelledby="arcade-title">
        <h1 id="arcade-title" class="wordmark" data-image-fallback tabindex="-1">
          <span class="visually-hidden">ZANG Arcade</span>
          <span class="wordmark-text" aria-hidden="true">ZANG <span>ARCADE</span></span>
          <img class="wordmark-art" src="./art/brand/zang-arcade.webp" alt="">
        </h1>
        <div class="carousel-machine" id="carousel-machine" hidden>
          <div class="machine-body">
            <img class="machine-art" id="machine-art" src="./art/brand/cartridge-display.webp" alt="">
            <div class="cartridge-gallery" id="cartridge-gallery" aria-hidden="true">
              <div class="gallery-grid"></div>
              <div class="gallery-shadow"></div>
              <div class="gallery-scene">
                <div class="gallery-float">
                  <div class="gallery-cartridge" id="gallery-cartridge"></div>
                </div>
              </div>
              <canvas id="gallery-mesh" class="gallery-mesh" hidden></canvas>
            </div>
            <span class="carousel-meta" id="carousel-meta"></span>
            <button class="carousel-turn" id="carousel-turn" type="button" hidden>Turn over</button>
            <button class="carousel-motion" id="carousel-motion" type="button" aria-pressed="false" aria-label="Pause cartridge motion" title="Pause cartridge motion">Ⅱ</button>
            <div class="carousel-controls" id="carousel-controls">
              <label class="visually-hidden" for="carousel-select">Cartridge</label>
              <button class="carousel-arrow" id="carousel-prev" type="button" aria-label="Previous cartridge">←</button>
              <select id="carousel-select"></select>
              <button class="carousel-arrow" id="carousel-next" type="button" aria-label="Next cartridge">→</button>
              <a class="carousel-play" id="carousel-play">Play <span aria-hidden="true">↗</span></a>
              <span class="visually-hidden" id="carousel-announcement" aria-live="polite"></span>
            </div>
          </div>
          <div class="carousel-drum-controls" id="carousel-drum-controls" role="group" aria-label="Cartridge drums" hidden>
            <button type="button" data-band="0" aria-label="Turn head band">Head</button>
            <button type="button" data-band="1" aria-label="Turn body band">Body</button>
            <button type="button" data-band="2" aria-label="Turn legs band">Legs</button>
            <button type="button" id="carousel-drum-auto" aria-pressed="true">Auto shuffle</button>
          </div>
        </div>
      </section>

      <section class="inventory" id="inventory" aria-labelledby="inventory-title">
        <header class="inventory-header">
          <h2 id="inventory-title">Game shelf</h2>
          <p id="inventory-status" role="status">Loading games…</p>
        </header>
        <ul class="game-grid" id="game-grid"></ul>
        <noscript><p>Enable JavaScript to load the game shelf.</p></noscript>
      </section>
    </main>

    <footer class="site-footer wrap">
      <span class="brand" data-image-fallback role="img" aria-label="ZANG Arcade">
        <span class="brand-mark" aria-hidden="true">Z</span><img src="./art/brand/zang-mark.webp" alt="" width="40" height="40">
      </span>
      <a href="#arcade-title">Back to top <span aria-hidden="true">↑</span></a>
    </footer>
  </div>

  <template id="game-card-template">
    <li class="game-item">
      <a class="game-card">
        <span class="retail-box">
          <span class="case-tray" aria-hidden="true"></span>
          <span class="case-content">
            <span class="case-pocket" aria-hidden="true"><span class="case-cartridge"></span></span>
            <span class="box-blurb" hidden></span>
          </span>
          <span class="case-lid" aria-hidden="true">
            <span class="retail-face">
              <span class="box-fallback">
                <span class="box-imprint">ZANG ARCADE</span>
                <strong></strong>
              </span>
              <img class="box-cover" alt="" hidden>
            </span>
            <span class="case-inside"></span>
          </span>
        </span>
        <span class="game-info">
          <strong class="game-title"></strong>
          <span class="game-meta"></span>
          <span class="game-action" aria-hidden="true">Play <span>→</span></span>
        </span>
      </a>
      <button class="case-preview-button" type="button" aria-expanded="false">Preview</button>
    </li>
  </template>

  <template id="cartridge-template">
    <span class="cartridge-model" aria-hidden="true">
      <span class="cartridge-slab"></span>
      <span class="cartridge-slab"></span>
      <span class="cartridge-slab"></span>
      <span class="cartridge-slab"></span>
      <span class="cartridge-slab"></span>
      <span class="cartridge-front">
        <span class="cartridge-faceplate"></span>
        <span class="cartridge-grip"></span>
        <span class="cartridge-hardware"></span>
        <span class="cartridge-label">
          <span class="cartridge-label-title"></span>
          <img class="cartridge-mark" alt="" hidden>
        </span>
        <span class="cartridge-connector"></span>
      </span>
    </span>
  </template>

  <dialog class="ritual" id="ritual" aria-labelledby="ritual-title">
    <header class="ritual-header">
      <div>
        <span class="ritual-overline" id="ritual-overline">Load cartridge</span>
        <h2 id="ritual-title"></h2>
      </div>
      <a class="ritual-skip" id="ritual-skip" href="#inventory">Skip to game <span aria-hidden="true">→</span></a>
    </header>
    <div class="ritual-stage" id="ritual-stage" aria-hidden="true">
      <div class="ritual-box" id="ritual-box">
        <div class="ritual-box-inner">
          <div class="ritual-tray"></div>
          <div class="ritual-lid" id="ritual-lid">
            <div class="ritual-lid-front"><span id="ritual-box-title"></span></div>
            <div class="ritual-lid-back"></div>
          </div>
        </div>
      </div>
      <div class="ritual-dock">
        <div class="ritual-device-motion" id="ritual-device-motion">
          <div class="slot-machine" id="ritual-machine">
            <div class="slot-machine-top">
              <span class="slot-badge">ZANG</span>
              <div class="slot-mouth" id="ritual-slot"><span class="slot-loaded-cart"></span></div>
              <span class="slot-led"></span>
            </div>
            <div class="slot-machine-front"></div>
          </div>
        </div>
      </div>
      <div class="ritual-cart" id="ritual-cart"></div>
    </div>
    <p class="ritual-status" id="ritual-status" role="status"></p>
  </dialog>
</body>
</html>
